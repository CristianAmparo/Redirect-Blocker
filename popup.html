<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirect Guard</title>
  <style>
    :root {
      --bg: #1e1f22; --panel: #2b2d31; --text: #e8e8ea; --muted: #9a9ca3;
      --accent: #4c8bf5; --danger: #e5534b; --ok: #3fb950; --border: #3a3c42;
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 340px; font: 13px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 14px; margin: 0; }
    .count { color: var(--muted); }
    .count b { color: var(--danger); font-size: 15px; }
    section { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
    .site { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .site-name { font-weight: 600; word-break: break-all; }
    .switch { position: relative; width: 38px; height: 22px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--border); border-radius: 22px; cursor: pointer; transition: .15s; }
    .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
    .switch input:checked + .slider { background: var(--ok); }
    .switch input:checked + .slider::before { transform: translateX(16px); }
    .switch input:disabled + .slider { opacity: .4; cursor: default; }
    .note { color: var(--muted); margin-top: 6px; display: none; }
    .note.show { display: block; }
    button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    ul { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
    li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid var(--border); }
    li:first-child { border-top: 0; }
    .kind { flex: none; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--panel); color: var(--muted); }
    .host { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Redirect Guard</h1>
    <span class="count">Blocked on this tab: <b id="count">0</b></span>
  </header>

  <section>
    <div class="site">
      <span class="site-name" id="site">—</span>
      <label class="switch" title="Protect this site">
        <input type="checkbox" id="toggle">
        <span class="slider"></span>
      </label>
    </div>
    <div class="note" id="note">Reload the page to apply. <button id="reload">Reload</button></div>
  </section>

  <section>
    <h2>Recently blocked on this tab</h2>
    <ul id="log"></ul>
  </section>

  <section>
    <h2>Domains you blocked</h2>
    <ul id="domains"></ul>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
